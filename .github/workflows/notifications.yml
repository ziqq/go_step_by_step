name: Notifications

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  new-issues:
    if: github.event.issue.user.login != github.repository_owner
    uses: ziqq/actions/.github/workflows/notify-events.yml@7737ce8c4d87c656b7ccf5f78138d8d7e53a1b62
    with:
      notify-issues: true
    secrets:
      DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_TARGETS: ${{ secrets.TELEGRAM_TARGETS }}
